<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="fragments/header :: header"></head>
<body>
<div th:replace="fragments/navigation :: navigation"></div>
<div class="container content pt-5">
    <div class="row">
        <div class="col-3"></div>
        <div class="col-6">
            <form class="mt-3" th:action="@{/registration}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label"><b>Логин</b></label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Ivan123"
                           required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label"><b>Пароль</b></label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="mb-3 row">
                    <div class="col-6"></div>
                    <div class="col-6">
                        <div class="row">
                            <div class="col-6"><a class="btn btn-danger w-100"
                                                  th:href="@{/login}">Отмена</a></div>
                            <div class="col-6">
                                <button class="btn btn-primary w-100"
                                        type="submit">Сохранить
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-3"></div>
    </div>
</div>
<div th:include="fragments/footer :: footer"></div>
</body>
</html>
