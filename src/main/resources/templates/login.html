<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="fragments/header :: header"></head>
<body>
<div th:replace="fragments/navigation :: navigation"></div>
<div class="container content pt-5">
    <div class="row">
        <div class="col-3"></div>
        <div class="col-6">
            <div th:if="${not #lists.isEmpty(errorMessage)}" class="alert alert-danger" role="alert">
                <span th:text="${errorMessage}"></span>
            </div>
            <form th:action="@{/login}" method="post">
                <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" name="username">
                    <label for="username">User name</label>
                </div>
                <div class="form-floating">
                    <input type="password" class="form-control" id="password" name="password">
                    <label for="password">Password</label>
                </div>
                <div class="col-7 m-3">
                    <p>Не зарегистрированы? <span>
                            <a th:href="@{/registration}">Зарегистрироваться</a></span></p>
                </div>
                <hr class="my-4">
                <button type="submit" class="w-100 btn btn-lg btn-primary">Авторизация</button>
            </form>
        </div>
        <div class="col-3"></div>
    </div>
</div>
<footer th:include="fragments/footer :: footer"></footer>
</body>
</html>
